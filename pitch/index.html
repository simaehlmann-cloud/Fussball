<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Content-Security-Policy: PitchPro laedt nichts nach. Alles steckt in
     dieser Datei, die App baut von sich aus keine Verbindung nach aussen auf. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>PitchPro</title>
<link rel="icon" type="image/png" href="image.png">
<link rel="apple-touch-icon" href="image.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  /* Farbfamilie wie TacticBoard: dunkle Oberflaeche, Rasengruen, Kader-Blau */
  --bg:#1a1a1a; --surface:#262626; --surface2:#303030; --line:#3b3b3b;
  --text:#f3f3f3; --muted:#a9a9a9;
  --green:#4caf50; --green-d:#2e7d32; --green-soft:#24402a;
  --opp:#2a6f97; --opp-soft:#1f3442;
  --yellow:#f4c20d; --red:#e53935; --amber:#ff9f1c; --amber-soft:#3d2c12;
  --top:#111111;
  --soft-ink:#a5e0a8; --bench:#202020; --opp-ink:#7fb8dc;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:14px;
}
/* Hell-Modus: besser lesbar in praller Sonne */
:root[data-theme="light"] {
  --bg:#eef2ee; --surface:#ffffff; --surface2:#e6ece7; --line:#c9d3cb;
  --text:#0e1a12; --muted:#4f5d54;
  --green:#2e7d32; --green-d:#1f6b2a; --green-soft:#dcefdf;
  --opp:#2a6f97; --opp-soft:#dde9f3;
  --amber-soft:#fff1d6; --amber:#c76a00;
  --top:#0b3d1f; --soft-ink:#1b5e20; --bench:#f4f6f4; --opp-ink:#1f5f86;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100%; }
body { display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; }
input, textarea { user-select:text; -webkit-user-select:text; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
.num { font-variant-numeric:tabular-nums; }

/* ---------- Kopfzeile ---------- */
#top { color:#fff; background:var(--top); padding:calc(var(--safe-t) + 6px) 8px 8px; display:flex; align-items:center; gap:4px; min-height:56px; flex:0 0 auto; }
#top .title { flex:1; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:6px; }
#top button { min-width:44px; height:44px; padding:0 10px; border-radius:10px; font-size:16px; font-weight:700; }
#top button:active { background:#222; }
#back { font-size:26px !important; }
.brand { display:inline-flex; align-items:center; gap:12px; }
.brand img { border-radius:10px; flex:0 0 38px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
.brand span { font-size:27px; font-weight:900; letter-spacing:.2px; }
@media (max-width:360px){ .brand span { font-size:22px; } .brand img { width:32px; height:32px; flex-basis:32px; } }
#top button#right, #top button#right2 { font-size:22px; }
#back[hidden], #right[hidden], #right2[hidden], #flags[hidden] { display:none; }
#flags { display:flex; gap:4px; margin-right:2px; }
#top button.flag { min-width:0; width:42px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.flag svg { border-radius:3px; opacity:.45; transition:opacity .15s, transform .15s; box-shadow:0 0 0 1px rgba(255,255,255,.25); }
.flag.on svg { opacity:1; transform:scale(1.1); box-shadow:0 0 0 2px #fff; }

#view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(var(--safe-b) + 90px); }
.wrap { max-width:720px; margin:0 auto; }

/* ---------- Bausteine ---------- */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }
.sec { display:flex; justify-content:space-between; align-items:center; margin:22px 2px 8px; }
.sec h2 { margin:0; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.sec .meta { font-size:13px; font-weight:800; color:var(--green); }
.sec .link { color:var(--green); font-weight:700; font-size:14px; padding:6px 4px; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; padding:0 16px;
  border-radius:var(--r); font-size:16px; font-weight:800; background:var(--green); color:#fff; }
.btn:active { filter:brightness(0.85); }
.btn.lg { min-height:60px; font-size:19px; }
.btn.soft { background:var(--green-soft); color:var(--soft-ink); }
.btn.ghost { background:transparent; border:1.5px solid var(--line); color:var(--text); }
.btn.danger { background:var(--red); }
.btn.opp { background:var(--opp); }
.btn[disabled] { opacity:.35; pointer-events:none; }
.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; }
.stack > * + * { margin-top:8px; }
.hint { color:var(--muted); font-size:13px; line-height:1.45; margin:6px 2px 0; }
.empty { color:var(--muted); font-size:15px; padding:10px 2px; line-height:1.45; }
input.in, textarea.in { width:100%; min-height:50px; padding:0 12px; border-radius:var(--r); border:1.5px solid var(--line);
  background:var(--bg); color:var(--text); font-size:17px; outline:none; }
textarea.in { padding:12px; min-height:150px; resize:vertical; font-size:16px; }
input.in:focus, textarea.in:focus { border-color:var(--green); }
input.nr { width:68px; flex:0 0 68px; text-align:center; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:9px 14px; border-radius:999px; border:1.5px solid var(--line); font-size:15px; font-weight:600; background:var(--surface); }
.chip.on { background:var(--green); border-color:var(--green); color:#fff; }
.chip.on.opp { background:var(--opp); border-color:var(--opp); }
.list-row { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:14px 16px; margin-bottom:8px; width:100%; text-align:left; }
.list-row:active { background:var(--surface2); }
.list-row .main { flex:1; min-width:0; }
.list-row .t1 { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .t2 { font-size:13px; color:var(--muted); margin-top:2px; }
.list-row .big { font-size:24px; font-weight:900; color:var(--green); }
.dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
.pnum { width:32px; font-size:18px; font-weight:900; color:var(--green); }

/* Stepper */
.step { display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:8px; }
.step .lbl { font-size:16px; flex:1; }
.step .ctl { display:flex; align-items:center; gap:6px; }
.step .ctl button { width:44px; height:44px; border-radius:22px; background:var(--green-soft); color:var(--soft-ink); font-size:24px; font-weight:700; }
.step .val { min-width:66px; text-align:center; font-size:17px; font-weight:800; }
.toggle { display:flex; align-items:center; gap:12px; padding-top:10px; width:100%; text-align:left; }
.sw { width:52px; height:32px; border-radius:16px; background:var(--line); padding:3px; flex:0 0 52px; transition:background .15s; }
.sw i { display:block; width:26px; height:26px; border-radius:13px; background:#fff; transition:transform .15s; }
.sw.on { background:var(--green); } .sw.on i { transform:translateX(20px); }

/* Aufstellung */
.lu { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:6px 6px 6px 12px; min-height:58px; margin-bottom:8px; }
.lu.absent { opacity:.45; }
.lu .nm { flex:1; font-size:16px; font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg { display:flex; background:var(--bg); border-radius:10px; padding:3px; }
.seg button { padding:9px 10px; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); }
.seg button.on { background:var(--green); color:#fff; }
.tw { font-size:12px; font-weight:900; padding:7px 8px; border-radius:8px; border:1.5px solid var(--line); color:var(--muted); }
.tw.on { background:var(--amber); border-color:var(--amber); color:#1a1a1a; }

/* ---------- Live ---------- */
.board { background:var(--green-d); color:#fff; margin:-16px -16px 0; padding:10px 16px 12px;
  /* Anzeigetafel bleibt beim Scrollen oben stehen - Uhr und Knoepfe immer im Blick.
     Feste Groesse: eine Tafel, die beim Scrollen schrumpft, verschiebt die Seite und flackert. */
  position:sticky; top:-16px; z-index:5; box-shadow:0 6px 14px rgba(0,0,0,.35); }
.score-row { display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto; }
.score-row .tn { flex:1; font-size:15px; font-weight:700; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.score-row .tn.r { text-align:right; }
button.tn { color:#fff; padding:6px 8px; border-radius:10px; background:rgba(255,255,255,.12); }
button.tn:active { background:rgba(255,255,255,.28); }
.score { font-size:44px; font-weight:900; letter-spacing:1px; }
.clock { display:block; margin:0 auto; font-size:32px; font-weight:800; text-align:center; padding:0 12px; border-radius:10px; }
.clock.over { color:var(--yellow); }
.status { text-align:center; font-size:13px; font-weight:600; color:rgba(255,255,255,.8); }
.ctrls { display:flex; gap:8px; margin:10px auto 0; max-width:720px; }
.ctrls .btn { min-height:46px; }
.ctrls .btn { background:rgba(255,255,255,.95); color:var(--green-d); }
.ctrls .btn.danger { background:var(--red); color:#fff; }
.quick { display:flex; gap:8px; margin:8px auto 0; max-width:720px; }
.qbtn { flex:1; min-height:40px; border-radius:10px; background:rgba(0,0,0,.22); color:#fff; font-weight:800; font-size:15px; padding:0 10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qbtn:active { background:rgba(0,0,0,.35); }
.qbtn[disabled] { opacity:.35; }
.qbtn:last-child { flex:0 0 56px; font-size:20px; }

.due { background:var(--amber-soft); border:2px solid var(--amber); border-radius:var(--r); padding:14px; margin-top:16px; }
.due h3 { margin:0 0 8px; color:var(--amber); font-size:19px; }
.sug { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.sug span { flex:1; font-size:16px; font-weight:700; }
.sug .btn { width:auto; min-height:44px; }
.next { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-top:16px; font-size:14px; color:var(--muted); }
.next b { color:var(--text); }
.next .s { color:var(--text); font-weight:600; margin-top:2px; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile { position:relative; overflow:hidden; background:var(--surface); border:2px solid var(--green); border-radius:12px; padding:0 10px; min-height:48px;
  text-align:left; display:flex; align-items:center; gap:6px; width:100%; }
.tile:active { transform:scale(.97); }
.tile.bench { border-color:var(--line); background:var(--bench); }
.tile .top { display:flex; align-items:center; gap:6px; }
.tile .n { font-size:17px; font-weight:900; color:var(--green); min-width:18px; }
.tile.bench .n { color:var(--muted); }
.tile .m { margin-left:auto; flex:0 0 auto; font-size:13px; font-weight:700; color:var(--muted); }
.tile .nm { flex:1; min-width:0; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .ib { flex:0 0 auto; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:800; }
.tile .ib .cardi { width:8px; height:12px; }
.tile .twb { flex:0 0 auto; font-size:10px; padding:1px 4px; }
.tile .bar { position:absolute; left:0; right:0; bottom:0; height:3px; margin:0; border-radius:0; }
.tile .bar i { height:3px; }
.twb { font-size:11px; font-weight:900; background:var(--amber); color:#1a1a1a; padding:1px 5px; border-radius:5px; }
.badges { display:flex; align-items:center; gap:6px; height:18px; margin-top:4px; font-size:13px; font-weight:800; }
.cardi { width:10px; height:14px; border-radius:2px; display:inline-block; }
.bar { height:4px; background:var(--bg); border-radius:2px; margin-top:8px; overflow:hidden; }
.bar i { display:block; height:4px; background:var(--green); }
.sentoff { color:var(--red); font-weight:600; margin-top:8px; }
.oppbtn { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--opp); color:#fff; border-radius:12px; padding:0 14px; min-height:50px; margin-top:12px; }
.oppbtn:active { filter:brightness(.85); }
.oppbtn .t1 { flex:1; min-width:0; font-size:17px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.oppbtn .t2 { flex:0 0 auto; font-size:13px; color:rgba(255,255,255,.85); font-weight:700; }
.fold { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:0; }
.fold h2 { flex:1; }
.fold .ar { color:var(--muted); font-size:14px; }
.otile { background:var(--opp-soft); border-radius:12px; padding:0 10px; min-height:44px; text-align:left; width:100%; display:flex; align-items:center; gap:6px; }
.otile .n { font-size:16px; font-weight:900; color:var(--opp-ink); min-width:18px; }
.otile .nm { flex:1; min-width:0; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.otile .ib { flex:0 0 auto; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:800; }
.ev { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; }
.ev .mi { width:52px; font-size:15px; font-weight:800; }
.ev .mk { width:4px; align-self:stretch; border-radius:2px; }
.ev .tx { flex:1; font-size:15px; }

/* Statistik */
.teamsel { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.teamsel::-webkit-scrollbar { display:none; }
.teamsel .chip { flex:0 0 auto; font-size:16px; padding:11px 16px; }
.about-head { display:flex; align-items:center; gap:16px; }
.about-head img { border-radius:16px; flex:0 0 72px; }
.about-head .ah1 { font-size:24px; font-weight:900; }
.about p { margin:0; font-size:15px; line-height:1.55; }
.about p + p { margin-top:10px; }
.about b { color:var(--soft-ink); }
.notes { min-height:84px; font-size:16px; background:var(--surface); }
.notes-view { white-space:pre-wrap; font-size:15px; line-height:1.5; user-select:text; -webkit-user-select:text; }
.ast { color:var(--soft-ink); }
.so-row { padding:10px 0; border-top:1px solid var(--line); }
.so-name { font-weight:700; margin-bottom:6px; }
.so-dots { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; min-height:22px; }
.so-dot { width:22px; height:22px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; }
.so-dot.in { background:var(--green); color:#fff; }
.so-dot.out { background:var(--red); color:#fff; }
.so-sm { display:block; font-size:12px; color:var(--muted); text-align:right; font-weight:700; }
.srec { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; font-size:15px; color:var(--muted); margin-bottom:6px; }
.srec b { font-size:30px; color:var(--text); }
.srec span { color:var(--text); font-weight:700; }
.srow { display:flex; justify-content:space-between; padding:8px 0 0; border-top:1px solid var(--line); margin-top:8px; font-size:14px; }
.srow span:first-child { color:var(--muted); font-weight:700; }
.sp { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:8px; }
.sp .top { display:flex; align-items:center; gap:10px; }
.sp .main { flex:1; min-width:0; }
.sp .t1 { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .t2 { font-size:13px; color:var(--muted); margin-top:2px; }
.sp .gl { font-size:18px; font-weight:900; text-align:right; white-space:nowrap; }
.sp .gl small { display:block; font-size:11px; color:var(--muted); font-weight:600; }
.sp .bar { height:6px; margin-top:10px; }
.sp .sl { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-top:6px; }

/* Bericht */
.rhead { text-align:center; padding:26px 16px; }
.rhead .tm { font-size:17px; font-weight:700; }
.rhead .sc { font-size:60px; font-weight:900; color:var(--green); }
.rhead .ht { color:var(--muted); font-weight:600; }
.rhead .dt { color:var(--muted); font-size:13px; margin-top:8px; }
.pt { margin-bottom:10px; }
.pt .r { display:flex; justify-content:space-between; font-size:15px; font-weight:600; }
.pt .bar { height:6px; margin-top:4px; }

/* Feldansicht */
.pitch { position:relative; width:100%; max-width:460px; margin:0 auto; border-radius:var(--r); overflow:hidden;
  background:repeating-linear-gradient(180deg,#2e8b3a 0 10%,#287f35 10% 20%); border:2px solid rgba(255,255,255,.35); }
.pitch::before { content:''; display:block; padding-top:118%; }
.pitch i { position:absolute; border:2px solid rgba(255,255,255,.45); pointer-events:none; }
.pitch .box { left:22%; right:22%; bottom:-2px; height:15%; }
.pitch .six { left:37%; right:37%; bottom:-2px; height:6%; }
.pitch .circ { left:50%; top:0; width:30%; padding-top:30%; transform:translate(-50%,-50%); border-radius:50%; }
.pp { position:absolute; transform:translate(-50%,-50%); width:72px; display:flex; flex-direction:column; align-items:center; color:#fff; }
.pp:active { transform:translate(-50%,-50%) scale(.94); }
.pp .dotn { position:relative; width:44px; height:44px; border-radius:50%; background:#fff; color:#1f6b2a; font-weight:900; font-size:18px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35); }
.pp.kp .dotn { background:var(--amber); color:#1a1a1a; }
.pp .pn { font-size:12px; font-weight:800; margin-top:3px; max-width:72px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px rgba(0,0,0,.7); }
.pp .pm { font-size:11px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.7); }
.pp .pg { position:absolute; top:-6px; right:-10px; font-size:12px; background:#fff; color:#111; border-radius:9px; padding:0 4px; line-height:18px; }
.pp .pc { position:absolute; top:-4px; left:-6px; width:10px; height:14px; border-radius:2px; }
/* Wechselplan, Profil */
.plan-row { padding:10px 12px; }
.plan-row .pnum { width:auto; min-width:40px; }
.plan-now { font-size:16px; font-weight:700; margin-bottom:10px; line-height:1.4; }
button.sp { display:block; width:100%; text-align:left; }
button.sp:active { background:var(--surface2); }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.kpi { background:var(--surface2); border-radius:10px; padding:10px 8px; text-align:center; }
.kpi b { display:block; font-size:22px; font-weight:900; }
.kpi span { font-size:11px; color:var(--muted); font-weight:700; }
.res { flex:0 0 30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:14px; }
/* Einfuehrung */
#onb { position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding:calc(var(--safe-t) + 14px) 22px calc(var(--safe-b) + 22px); }
#onb[hidden] { display:none; }
#onb .otop { display:flex; align-items:center; gap:6px; }
#onb .ob { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; max-width:460px; margin:0 auto; }
#onb .oi { font-size:72px; line-height:1; margin-bottom:18px; }
#onb h2 { font-size:26px; font-weight:900; margin:0 0 10px; }
#onb p { font-size:17px; line-height:1.5; color:var(--muted); margin:0; }
#onb .dots { display:flex; gap:8px; justify-content:center; margin:22px 0 18px; }
#onb .dots i { width:9px; height:9px; border-radius:5px; background:var(--line); }
#onb .dots i.on { background:var(--green); width:24px; }
#onb .flag { width:42px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:8px; }

/* ---------- Auswahlblatt ---------- */
#ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:20; }
#ov.open { display:block; }
#sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--bg); border-radius:22px 22px 0 0;
  padding:12px 16px calc(var(--safe-b) + 16px); max-height:88vh; overflow-y:auto; transform:translateY(105%); transition:transform .2s ease;
  max-width:720px; margin:0 auto; border-top:1px solid var(--line); }
#sheet.open { transform:translateY(0); }
#sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
#sheet h3 { margin:0; font-size:21px; font-weight:800; }
#sheet .sub { color:var(--muted); font-size:14px; margin:3px 0 12px; }
.act { display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:8px 16px; border-radius:var(--r);
  background:var(--surface); border:1px solid var(--line); text-align:left; margin-bottom:8px; }
.act:active { background:var(--surface2); }
.act .sw2 { width:16px; height:24px; border-radius:3px; flex:0 0 16px; }
.act .l { font-size:17px; font-weight:700; }
.act .h { font-size:13px; color:var(--muted); }
.preview { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px; margin:8px 0; font-size:15px; line-height:1.6; }

#toast { position:fixed; left:50%; bottom:calc(var(--safe-b) + 24px); transform:translateX(-50%); background:#f3f3f3; color:#111;
  padding:12px 18px; border-radius:12px; font-weight:600; font-size:15px; z-index:30; opacity:0; pointer-events:none; transition:opacity .2s;
  max-width:90vw; text-align:center; }

let LANG = (function(){
  try { const s = localStorage.getItem('pp_lang'); if(s === 'de' || s === 'en') return s; } catch(e){}
  return /^de\b/i.test(navigator.language || 'de') ? 'de' : 'en';
})();

let FOLD = (function(){ try { return Object.assign({ notes: true, tl: true }, JSON.parse(localStorage.getItem('pp_fold') || '{}')); } catch(e){ return { notes: true, tl: true }; } })();
let FIELD_VIEW = (function(){ try { return localStorage.getItem('pp_field') === '1'; } catch(e){ return false; } })();
function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', THEME === 'light' ? '#0b3d1f' : '#111111');
}
applyTheme();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const byNumber = (a, b) => ((a.number == null ? 999 : a.number) - (b.number == null ? 999 : b.number)) || a.name.localeCompare(b.name);
const IST_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function vibrate(p){ try { if(navigator.vibrate) navigator.vibrate(p); } catch(e){} }

const EMBEDDED = (() => { try { return window.parent !== window; } catch(e){ return true; } })();
const BRIDGE_ORIGIN = location.origin && location.origin !== 'null' ? location.origin : null;

/* Kennungen: nur Buchstaben, Ziffern, _ und - (sie stehen in data-Attributen) */
const cleanId = v => { const x = String(v == null ? '' : v).replace(/[^\w-]/g, '').slice(0, 40); return x || null; };
function cleanPlayer(p){
  if(!p || typeof p !== 'object') return null;
  const name = String(p.name || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  if(!name) return null;
  const n = parseInt(p.number, 10);
  const out = { id: cleanId(p.id) || uid(), name, number: isFinite(n) && n >= 0 && n < 1000 ? n : null,
           keeper: p.keeper === true, sel: p.sel !== false };
  // Felder, die nur TacticBoard nutzt, unveraendert mitfuehren - sonst gingen
  // sie beim Zurueckexportieren verloren
  if(p.tb && typeof p.tb === 'object') out.tb = { role: TB_ROLES.indexOf(p.tb.role) !== -1 ? p.tb.role : '', captain: p.tb.captain === true };
  return out;
}
const TB_ROLES = ['tw', 'def', 'mid', 'att'];
function cleanTeam(t){
  if(!t || typeof t !== 'object') return null;
  const name = String(t.name || '').trim().slice(0, 50);
  if(!name) return null;
  const out = { id: cleanId(t.id) || uid(), name, isOwn: t.isOwn !== false,
           players: (Array.isArray(t.players) ? t.players : []).slice(0, 60).map(cleanPlayer).filter(Boolean) };
  if(t.tb && typeof t.tb === 'object') out.tb = JSON.parse(JSON.stringify(t.tb));
  return out;
}
const num = (v, a, b, d) => { const n = Number(v); return isFinite(n) ? clampN(n, a, b) : d; };

/* Spiel aus Speicher oder Sicherungsdatei pruefen und auf bekannte Felder reduzieren */
function cleanMatch(m){
  if(!m || typeof m !== 'object' || !m.clock || !Array.isArray(m.events)) return null;
  const id = cleanId(m.id); if(!id) return null;
  const pl = arr => (Array.isArray(arr) ? arr : []).map(cleanPlayer).filter(Boolean).map(p => ({ id: p.id, name: p.name, number: p.number }));
  const ownPlayers = pl(m.ownPlayers), oppPlayers = pl(m.oppPlayers);
  const known = new Set(ownPlayers.concat(oppPlayers).map(p => p.id));
  const pid = v => { const x = cleanId(v); return x && known.has(x) ? x : null; };
  const st = ['pre', 'running', 'paused', 'break', 'finished'];
  const c = m.clock, s = m.settings || {};

    if(!e || typeof e !== 'object') return null;
    const base = { id: cleanId(e.id) || uid(), side: e.side === 'opp' ? 'opp' : 'own',
      period: num(e.period, 1, 12, 1), periodMs: num(e.periodMs, 0, 1e8, 0), gameMs: num(e.gameMs, 0, 1e8, 0) };
    if(e.brk) base.brk = e.brk === 'ft' ? 'ft' : 'ht';
    if(e.type === 'goal') return Object.assign(base, { type: 'goal', kind: ['normal', 'penalty', 'ownGoal'].indexOf(e.kind) !== -1 ? e.kind : 'normal', playerId: pid(e.playerId), assistId: pid(e.assistId) });
    if(e.type === 'card') return ['yellow', 'yellowRed', 'red'].indexOf(e.card) !== -1 ? Object.assign(base, { type: 'card', card: e.card, playerId: pid(e.playerId) }) : null;
    if(e.type === 'sub'){ const i = pid(e.inId); return i ? Object.assign(base, { type: 'sub', outId: pid(e.outId), inId: i }) : null; }
    if(e.type === 'keeper') return Object.assign(base, { type: 'keeper', playerId: pid(e.playerId) });
    return null;
  }).filter(Boolean);
  return {
    id, createdAt: num(m.createdAt, 0, 9e15, Date.now()), kickoffAt: m.kickoffAt ? num(m.kickoffAt, 0, 9e15, null) : null,
    ownTeamId: cleanId(m.ownTeamId), ownName: String(m.ownName || '').slice(0, 50) || '–', oppName: String(m.oppName || '').slice(0, 50) || '–',
    oppTeamId: cleanId(m.oppTeamId), isHome: m.isHome !== false, ownPlayers, oppPlayers,
    startingIds: (Array.isArray(m.startingIds) ? m.startingIds : []).map(pid).filter(Boolean), keeperId: pid(m.keeperId),
    settings: { periods: num(s.periods, 1, 6, 2), periodMinutes: num(s.periodMinutes, 1, 90, 25), playersOnField: num(s.playersOnField, 1, 11, 7),
      subIntervalMinutes: num(s.subIntervalMinutes, 0, 90, 0), fairPlay: s.fairPlay === true, assists: s.assists === true },
    extra: m.extra && typeof m.extra === 'object' ? { periods: num(m.extra.periods, 1, 2, 2), minutes: num(m.extra.minutes, 1, 30, 10) } : null,
    shootout: Array.isArray(m.shootout) ? m.shootout.slice(0, 60).map(k => k && ({ id: cleanId(k.id) || uid(), side: k.side === 'opp' ? 'opp' : 'own', scored: k.scored === true })).filter(Boolean) : null,
    notes: typeof m.notes === 'string' ? m.notes.slice(0, 5000) : '', notesShare: m.notesShare === true,
    clock: (() => {
      const since = c.status === 'running' && c.runningSince ? num(c.runningSince, 0, 9e15, null) : null;

      const status = st.indexOf(c.status) === -1 || (c.status === 'running' && since == null) ? 'paused' : c.status;
      return { status, period: num(c.period, 1, 12, 1), periodElapsedMs: num(c.periodElapsedMs, 0, 1e8, 0),

    events: evs, reminderAckMs: num(m.reminderAckMs, 0, 1e9, 0),
    manual: m.manual === true,
    kp: cleanKp(m.kp, known),
    plan: (() => {
      if(!Array.isArray(m.plan)) return null;
      const out = m.plan.slice(0, 30).map(x => {
        if(!x || typeof x !== 'object') return null;
        const outs = [], ins = [];
        const o = Array.isArray(x.outs) ? x.outs : [], n = Array.isArray(x.ins) ? x.ins : [];
        for(let i = 0; i < Math.min(o.length, n.length, 11); i++){
          const a = pid(o[i]), b = pid(n[i]);

        return outs.length ? { min: num(x.min, 0, 999, 0), outs, ins, st: ['open', 'done', 'skip'].indexOf(x.st) !== -1 ? x.st : 'open' } : null;
      }).filter(Boolean);

    })()

}
/* Verknuepfung mit dem Kaderplaner: Spieltag-ID und Spieler-Zuordnung

const KP_ID = /^[A-Za-z0-9_.:-]{1,64}$/;   // gleich wie ID_RE im Kaderplaner
function cleanKp(k, known){
  if(!k || typeof k !== 'object' || typeof k.matchId !== 'string' || !KP_ID.test(k.matchId)) return null;
  const ids = {};
  if(k.ids && typeof k.ids === 'object') Object.keys(k.ids).slice(0, 60).forEach(pp => {
    const v = k.ids[pp];
    if((!known || known.has(pp)) && typeof v === 'string' && KP_ID.test(v)) ids[pp] = v;
  });

}

/* ---------------------------------------------------------------------
   SPIELUHR
   Laeuft ueber Zeitstempel - stimmt also auch, wenn die App im
   Hintergrund war oder neu gestartet wurde.
--------------------------------------------------------------------- */
const Clock = {
  fresh: () => ({ status: 'pre', period: 1, periodElapsedMs: 0, completedMs: 0, runningSince: null }),
  periodElapsed(c, now){
    const run = c.status === 'running' && c.runningSince != null ? now - c.runningSince : 0;
    return c.periodElapsedMs + Math.max(0, run);
  },
  game(c, now){
    if(c.status === 'break' || c.status === 'finished') return c.completedMs;
    return c.completedMs + Clock.periodElapsed(c, now);
  },
  stamp(c, now){
    const brk = c.status === 'break' || c.status === 'finished';
    const st = { period: c.period, periodMs: brk ? c.periodElapsedMs : Clock.periodElapsed(c, now), gameMs: Clock.game(c, now) };
    if(brk) st.brk = c.status === 'finished' ? 'ft' : 'ht';   // in der Pause bzw. nach Abpfiff notiert
    return st;
  },
  start(c, now){
    if(c.status === 'pre' || c.status === 'paused') return Object.assign({}, c, { status: 'running', runningSince: now });
    if(c.status === 'break') return Object.assign({}, c, { status: 'running', period: c.period + 1, periodElapsedMs: 0, runningSince: now });
    return c;
  },
  pause(c, now){
    if(c.status !== 'running') return c;
    return Object.assign({}, c, { status: 'paused', periodElapsedMs: Clock.periodElapsed(c, now), runningSince: null });
  },
  endPeriod(c, now, periods){
    if(c.status !== 'running' && c.status !== 'paused') return c;
    const el = Clock.periodElapsed(c, now);
    return Object.assign({}, c, { status: c.period >= periods ? 'finished' : 'break', periodElapsedMs: el,
      completedMs: c.completedMs + el, runningSince: null });
  },
  /* Versehentlich beendeten Abschnitt wieder aufnehmen (Uhr steht danach auf Pause) */
  reopen(c){
    if(c.status !== 'break' && c.status !== 'finished') return c;
    return Object.assign({}, c, { status: 'paused', completedMs: Math.max(0, c.completedMs - c.periodElapsedMs), runningSince: null });
  },
  adjust(c, now, delta){
    if(c.status !== 'running' && c.status !== 'paused') return c;
    const cur = Clock.periodElapsed(c, now);
    const target = Math.max(0, cur + delta);
    return Object.assign({}, c, { periodElapsedMs: c.periodElapsedMs + (target - cur) });
  }
};
function fmtClock(ms){
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
/* Regulaere Abschnitte + optionale Verlaengerung (m.extra = { periods, minutes }) */
const totalPeriods = m => m.settings.periods + (m.extra ? m.extra.periods : 0);
const isExtra = (m, p) => !!m.extra && p > m.settings.periods;
const periodLen = (m, p) => isExtra(m, p) ? m.extra.minutes : m.settings.periodMinutes;
function periodStartMin(m, p){
  const r = m.settings.periods, pm = m.settings.periodMinutes;
  return p <= r || !m.extra ? (p - 1) * pm : r * pm + (p - r - 1) * m.extra.minutes;
}
const fullLengthMs = m => (m.settings.periods * m.settings.periodMinutes + (m.extra ? m.extra.periods * m.extra.minutes : 0)) * 60000;
/* Fussball-Minute: 23', 45+2', in der Pause HZ. Zweites Argument: Spiel
   (oder - fuer einfache Faelle - nur die Abschnittslaenge in Minuten). */
function fmtMinute(st, m){
  if(typeof m === 'number') m = { settings: { periods: 99, periodMinutes: m } };
  if(st.brk === 'ft') return T().ftShort;
  if(st.brk) return m.settings.periods === 2 && st.period === 1 ? T().breakShort : T().pauseShort;
  const base = periodStartMin(m, st.period), len = periodLen(m, st.period);
  const min = Math.floor(st.periodMs / 60000) + 1;
  return min > len ? (base + len) + '+' + (min - len) + "'" : (base + min) + "'";
}
function displayClock(m, now){
  return fmtClock(periodStartMin(m, m.clock.period) * 60000 + Clock.periodElapsed(m.clock, now));
}
function periodLabelM(m, p){
  return isExtra(m, p) ? T().extraP(p - m.settings.periods) : periodLabel(p, m.settings.periods);
}
function breakLabelM(m, p){
  if(m.extra && p === m.settings.periods) return T().breakBeforeExtra;
  if(isExtra(m, p)) return T().breakAfter(periodLabelM(m, p));
  return breakLabel(p, m.settings.periods);
}
function periodLabel(p, n){
  const t = T();
  if(n === 2) return p === 1 ? t.p1 : t.p2;
  if(n === 4) return t.quarter(p);
  if(n === 3) return t.third(p);
  if(n === 1) return t.gameTime;
  return t.part(p);
}
const breakLabel = (p, n) => n === 2 ? T().breakHT : T().breakAfter(periodLabel(p, n));

/* ---------------------------------------------------------------------
   SPIELSTAND, SPIELZEITEN, WECHSELVORSCHLAEGE
   Alles wird aus Startaufstellung + Ereignissen abgeleitet. Deshalb
   bleibt der Zustand auch nach dem Loeschen eines Ereignisses stimmig.
--------------------------------------------------------------------- */
/* Reihenfolge nach Abschnitt und Minute im Abschnitt - so wie angezeigt. Nur
   bei Gleichstand entscheidet die Gesamtzeit. (Nach dem Bearbeiten einer
   Minute koennte die Gesamtzeit allein sonst eine andere Reihenfolge ergeben.) */
const sortEvents = evs => evs.slice().sort((a, b) => (a.period - b.period) || (a.periodMs - b.periodMs) || (a.gameMs - b.gameMs));

function derive(m, nowGame){
  const stats = {};
  m.ownPlayers.concat(m.oppPlayers).forEach(p => {
    stats[p.id] = { goals: 0, pens: 0, own: 0, assists: 0, yellow: 0, yellowRed: 0, red: 0, played: 0 };
  });
  const score = { own: 0, opp: 0 };
  const firstOver = m.clock.period > 1 || m.clock.status === 'break' || m.clock.status === 'finished';
  const onField = new Set(m.startingIds.filter(id => stats[id]));
  const sentOff = new Set();
  const since = {};
  let keeperId = m.keeperId || null;
  onField.forEach(id => { since[id] = 0; });
  const leave = (id, at) => {
    if(onField.has(id)){ stats[id].played += Math.max(0, at - since[id]); onField.delete(id); delete since[id]; }
  };
  sortEvents(m.events).forEach(e => {
    if(e.type === 'goal'){
      score[e.side]++;
      const s = e.playerId && stats[e.playerId];
      if(s){ if(e.kind === 'ownGoal') s.own++; else { s.goals++; if(e.kind === 'penalty') s.pens++; } }
      if(e.assistId && e.kind === 'normal' && stats[e.assistId]) stats[e.assistId].assists++;
    } else if(e.type === 'card'){
      const s = e.playerId && stats[e.playerId];
      if(s){
        s[e.card]++;
        if(e.card !== 'yellow'){ sentOff.add(e.playerId); leave(e.playerId, e.gameMs); }
      }
    } else if(e.type === 'sub' && e.side === 'own'){
      // Nur gueltige Wechsel zaehlen: wer raus soll, muss auf dem Platz stehen,
      // wer rein soll, auf der Bank. Nach dem Loeschen frueherer Ereignisse
      // koennen spaetere Wechsel ungueltig werden - die bleiben dann wirkungslos,
      // statt einen Spieler zu viel aufs Feld zu stellen.
      // outId leer = Spieler kommt zusaetzlich dazu (z. B. kam zu spaet).
      const canIn = stats[e.inId] && !sentOff.has(e.inId) && !onField.has(e.inId);
      if(!canIn) return;
      if(e.outId){
        if(!onField.has(e.outId)) return;
        leave(e.outId, e.gameMs);
        if(keeperId === e.outId) keeperId = e.inId;   // Torwart ausgewechselt -> Ersatz steht im Tor
      }
      onField.add(e.inId); since[e.inId] = e.gameMs;
    } else if(e.type === 'keeper' && e.side === 'own'){
      keeperId = e.playerId || null;
    }
  });
  onField.forEach(id => { stats[id].played += Math.max(0, nowGame - since[id]); });
  let halfTime = null;
  if(firstOver){
    halfTime = { own: 0, opp: 0 };
    m.events.forEach(e => { if(e.type === 'goal' && e.period === 1) halfTime[e.side]++; });
  }
  const ids = m.ownPlayers.slice().sort(byNumber).map(p => p.id);
  return {
    score, halfTime, stats, keeperId,
    onField: ids.filter(id => onField.has(id)),
    bench: ids.filter(id => !onField.has(id) && !sentOff.has(id)),
    sentOff: ids.filter(id => sentOff.has(id))
  };
}

/* Feldspieler mit der meisten Spielzeit raus, Bankspieler mit der
   wenigsten rein. Der Torwart wird nicht automatisch getauscht. */
function suggestSubs(m, st, minDiff){
  minDiff = minDiff == null ? 2 * 60000 : minDiff;
  const pl = id => st.stats[id] ? st.stats[id].played : 0;
  const field = st.onField.filter(id => id !== st.keeperId).sort((a, b) => pl(b) - pl(a));
  const bench = st.bench.filter(id => id !== st.keeperId).sort((a, b) => pl(a) - pl(b));
  const out = [];
  for(let i = 0; i < Math.min(field.length, bench.length); i++){
    const d = pl(field[i]) - pl(bench[i]);
    if(d < minDiff) break;
    out.push({ outId: field[i], inId: bench[i] });
  }
  return out;
}
function fairShare(m){
  const total = fullLengthMs(m);
  const k = m.keeperId ? 1 : 0;
  const slots = Math.max(0, m.settings.playersOnField - k);
  const n = Math.max(1, m.ownPlayers.length - k);
  return Math.min(total, slots * total / n);
}
/* ---------------------------------------------------------------------
   WECHSELPLAN
   Schritt i ist bei Minute (i+1) x Intervall vorgesehen. outs[j] geht fuer
   ins[j] - die Reihenfolge des Antippens bestimmt also, wer fuer wen kommt.
--------------------------------------------------------------------- */
function planSlots(s){
  const iv = s.subIntervalMinutes, total = s.periods * s.periodMinutes, out = [];
  if(!iv) return out;
  for(let x = iv; x < total && out.length < 30; x += iv) out.push(x);
  return out;
}
const pairsOf = st => st ? st.outs.slice(0, Math.min(st.outs.length, st.ins.length)).map((o, i) => [o, st.ins[i]]) : [];
/* Wer steht vor Schritt k auf dem Platz? */
function planField(starters, plan, k){
  const f = new Set(starters);
  for(let i = 0; i < k && i < plan.length; i++) pairsOf(plan[i]).forEach(([o, n]) => { if(f.has(o) && !f.has(n)){ f.delete(o); f.add(n); } });
  return f;
}
/* Plan an Aufstellung und Format anpassen (Spieler fehlt jetzt, Intervall geaendert ...) */
function fixPlan(d, present, starters){
  if(!d.plan) return;
  const slots = planSlots(d.settings);
  if(!slots.length){ d.plan = null; return; }
  const plan = d.plan.slice(0, slots.length);
  while(plan.length < slots.length) plan.push({ outs: [], ins: [] });
  const ok = new Set(present);
  for(let i = 0; i < plan.length; i++){
    const f = planField(starters, plan, i), x = plan[i];
    x.outs = x.outs.filter(id => ok.has(id) && f.has(id));
    x.ins = x.ins.filter(id => ok.has(id) && !f.has(id));
  }
  d.plan = plan;
}
/* Vorschlag: zu jedem Termin die Feldspieler mit den meisten Minuten gegen
   die Bankspieler mit den wenigsten tauschen (Torwart bleibt drin). */
function autoPlan(settings, present, starters, keeperId){
  const slots = planSlots(settings), iv = settings.subIntervalMinutes;
  const pl = {}; present.forEach(id => { pl[id] = 0; });
  const f = new Set(starters);
  let last = 0;
  return slots.map(x => {
    f.forEach(id => { pl[id] = (pl[id] || 0) + x - last; }); last = x;
    const field = [...f].filter(id => id !== keeperId).sort((a, b) => pl[b] - pl[a]);
    const bench = present.filter(id => !f.has(id) && id !== keeperId).sort((a, b) => pl[a] - pl[b]);
    const st = { outs: [], ins: [] };
    for(let i = 0; i < Math.min(field.length, bench.length); i++){
      if(pl[field[i]] - pl[bench[i]] < iv) break;
      st.outs.push(field[i]); st.ins.push(bench[i]);
    }
    pairsOf(st).forEach(([o, n]) => { f.delete(o); f.add(n); });
    return st;
  });
}
/* Naechster offener Planschritt mit Wechseln, die jetzt moeglich sind */
function nextPlanStep(m, st){
  if(!m.plan) return null;
  for(let i = 0; i < m.plan.length; i++){
    const x = m.plan[i];
    if(x.st !== 'open') continue;
    const pairs = pairsOf(x).filter(([o, n]) => st.onField.indexOf(o) !== -1 && st.bench.indexOf(n) !== -1);
    if(pairs.length) return { idx: i, min: x.min, pairs };
  }
  return null;
}
function andList(a){ return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' ' + T().and + ' ' + a[a.length - 1]; }

/* Feldansicht: Torwart unten, die anderen in Reihen (Rollen aus TacticBoard,
   sonst nach Rueckennummer auf eine uebliche Grundordnung verteilt) */
const AUTO_ROWS = { 1: [1], 2: [2], 3: [2, 1], 4: [2, 2], 5: [2, 2, 1], 6: [2, 3, 1], 7: [3, 3, 1], 8: [3, 3, 2], 9: [4, 3, 2], 10: [4, 4, 2], 11: [4, 4, 3] };
function fieldLayout(m, st){
  const team = teamById(m.ownTeamId);
  const roleOf = id => { const p = team && team.players.find(x => x.id === id); return p && p.tb ? p.tb.role : ''; };
  const kid = st.onField.indexOf(st.keeperId) !== -1 ? st.keeperId : null;
  const out = st.onField.filter(id => id !== kid);
  const roles = out.map(roleOf);
  let rows;
  if(out.length && roles.every(r => r === 'def' || r === 'mid' || r === 'att')){
    rows = ['def', 'mid', 'att'].map(r => out.filter((id, i) => roles[i] === r)).filter(r => r.length);
  } else {
    const shape = AUTO_ROWS[out.length] || [out.length];
    let i = 0; rows = shape.map(n => out.slice(i, i += n)).filter(r => r.length);
  }
  const pos = [];
  if(kid) pos.push({ id: kid, x: 50, y: 89 });
  const n = rows.length;
  rows.forEach((row, ri) => {
    const y = n === 1 ? 45 : 68 - ri * ((n === 2 ? 36 : 54) / (n - 1));
    row.forEach((id, ci) => pos.push({ id, x: (ci + 1) * 100 / (row.length + 1), y }));
  });
  return pos;
}

/* Kopf-an-Kopf-Bilanz gegen jeden Gegner (nach Vereinsname) */
function h2h(teamId, range){
  const [from, to] = rangeBounds(range);
  const map = {};
  DB.matches.filter(m => m.ownTeamId === teamId && m.clock.status === 'finished' && matchDate(m) >= from && matchDate(m) < to)
    .sort((a, b) => matchDate(b) - matchDate(a)).forEach(m => {
      const k = m.oppName.trim().toLowerCase();
      const r = map[k] || (map[k] = { key: k, name: m.oppName, n: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, matches: [] });
      const st = derive(m, m.clock.completedMs), res = matchResult(m, st.score);
      r.n++; r.gf += st.score.own; r.ga += st.score.opp;
      if(res > 0) r.w++; else if(res === 0) r.d++; else r.l++;
      r.matches.push(m);
    });
  return Object.keys(map).map(k => map[k]).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}
const isoDay = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayTs = v => { const x = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return x ? new Date(+x[1], +x[2] - 1, +x[3], 12).getTime() : Date.now(); };

/* Beginn eines Abschnitts in Spielzeit: aus einem Ereignis dieses Abschnitts
   (beruecksichtigt echte Nachspielzeit), sonst aus der Uhr, sonst nominell */
function periodStartMs(m, p){
  const e = m.events.find(x => x.period === p);
  if(e) return Math.max(0, e.gameMs - e.periodMs);
  const c = m.clock;
  if(c.period === p) return Math.max(0, c.completedMs - (c.status === 'break' || c.status === 'finished' ? c.periodElapsedMs : 0));
  return periodStartMin(m, p) * 60000;
}

function msUntilReminder(m, now){
  const iv = m.settings.subIntervalMinutes * 60000;
  if(!iv || m.clock.status === 'pre' || m.clock.status === 'finished') return null;
  return iv - (Clock.game(m.clock, now) - (m.reminderAckMs || 0));
}

/* ---------------------------------------------------------------------
   STATISTIK UEBER MEHRERE SPIELE
   Gezaehlt werden abgeschlossene Spiele des Teams. Spieler werden ueber
   ihre Kader-ID zusammengefuehrt, die in jedem Spiel gleich bleibt.
--------------------------------------------------------------------- */
function seasonStart(ts){
  const d = new Date(ts);
  return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1;   // Saison beginnt am 1. Juli
}
function seasonLabel(y){ return y + '/' + String(y + 1).slice(2); }
function rangeBounds(range){
  const y = seasonStart(Date.now());
  if(range === 'season') return [new Date(y, 6, 1).getTime(), new Date(y + 1, 6, 1).getTime()];
  if(range === 'first') return [new Date(y, 6, 1).getTime(), new Date(y + 1, 0, 1).getTime()];
  if(range === 'second') return [new Date(y + 1, 0, 1).getTime(), new Date(y + 1, 6, 1).getTime()];
  return [0, Infinity];
}
function teamStats(teamId, range){
  const [from, to] = rangeBounds(range);
  const team = teamById(teamId);
  const ms = DB.matches.filter(m => m.ownTeamId === teamId && m.clock.status === 'finished' && matchDate(m) >= from && matchDate(m) < to);
  const live = DB.matches.filter(m => m.ownTeamId === teamId && m.clock.status !== 'finished').length;
  const rec = () => ({ n: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
  const all = rec(), home = rec(), away = rec();
  const P = {};
  ms.slice().sort((a, b) => matchDate(b) - matchDate(a)).forEach(m => {
    const total = m.clock.completedMs;
    const st = derive(m, total);
    [all, m.isHome ? home : away].forEach(r => {
      r.n++; r.gf += st.score.own; r.ga += st.score.opp;
      const res = matchResult(m, st.score);   // nach Elfmeterschiessen zaehlt der Sieger
      if(res > 0) r.w++; else if(res === 0) r.d++; else r.l++;
    });
    const subbedIn = new Set(m.events.filter(e => e.type === 'sub' && e.side === 'own').map(e => e.inId));
    m.ownPlayers.forEach(p => {
      const kp = team && team.players.find(x => x.id === p.id);
      const a = P[p.id] || (P[p.id] = { id: p.id, name: kp ? kp.name : p.name, number: kp ? kp.number : p.number,
        keeper: !!(kp && kp.keeper), squad: 0, apps: 0, starts: 0, min: 0, possible: 0,
        goals: 0, pens: 0, own: 0, assists: 0, yellow: 0, yellowRed: 0, red: 0 });
      const ps = st.stats[p.id];
      const started = m.startingIds.indexOf(p.id) !== -1;
      a.squad++; a.possible += total; a.min += ps.played;
      if(started) a.starts++;
      if(started || subbedIn.has(p.id) || ps.played > 0) a.apps++;
      a.goals += ps.goals; a.pens += ps.pens; a.own += ps.own; a.assists += ps.assists;
      a.yellow += ps.yellow; a.yellowRed += ps.yellowRed; a.red += ps.red;
    });
  });
  const players = Object.keys(P).map(id => {
    const a = P[id];
    a.share = a.possible ? Math.round(a.min / a.possible * 100) : 0;
    a.avg = a.apps ? Math.round(a.min / a.apps / 60000) : 0;
    a.minutes = Math.round(a.min / 60000);
    a.cards = a.yellow + a.yellowRed * 2 + a.red * 3;
    return a;
  });
  const field = players.filter(a => !a.keeper && a.squad);
  const fairAvg = field.length ? Math.round(field.reduce((x, a) => x + a.share, 0) / field.length) : 0;
  return { matches: ms, live, all, home, away, players, fairAvg };
}
const STAT_SORT = {
  goals: (a, b) => b.goals - a.goals || b.assists - a.assists || b.minutes - a.minutes,
  assists: (a, b) => b.assists - a.assists || b.goals - a.goals,
  minutes: (a, b) => b.minutes - a.minutes || b.apps - a.apps,
  apps: (a, b) => b.apps - a.apps || b.minutes - a.minutes,
  cards: (a, b) => b.cards - a.cards || b.red - a.red,
  name: (a, b) => byNumber(a, b)
};
function rangeName(range){
  const t = T(), y = seasonStart(Date.now());
  if(range === 'season') return t.rangeSeason(seasonLabel(y));
  if(range === 'first') return t.rangeFirst + ' ' + seasonLabel(y);
  if(range === 'second') return t.rangeSecond + ' ' + seasonLabel(y);
  return t.rangeAll;
}
function statsText(team, range){
  const t = T(), S = teamStats(team.id, range);
  const L = ['📊 ' + team.name + ' – ' + rangeName(range)];
  L.push(S.all.n + ' ' + t.games + ': ' + t.wdl(S.all.w, S.all.d, S.all.l) + ' · ' + t.goalsFA(S.all.gf, S.all.ga));
  const sc = S.players.filter(a => a.goals).sort(STAT_SORT.goals);
  L.push('', t.txtScorers);
  if(sc.length) sc.forEach(a => L.push(pLabel(a) + ': ' + a.goals + (a.pens ? ' (' + t.pens(a.pens) + ')' : '')));
  else L.push(t.txtNoGoals);
  const as = S.players.filter(a => a.assists).sort(STAT_SORT.assists);
  if(as.length){ L.push('', t.txtAssists); as.forEach(a => L.push(pLabel(a) + ': ' + a.assists)); }
  L.push('', t.txtTimes);
  S.players.slice().sort(STAT_SORT.minutes).forEach(a => L.push(pLabel(a) + (a.keeper ? ' (TW)' : '') + ': ' + a.minutes + ' min (' + a.share + ' % · ' + a.apps + ')'));
  const cd = S.players.filter(a => a.cards).sort(STAT_SORT.cards);
  if(cd.length){
    L.push('', t.txtCards);
    cd.forEach(a => L.push(pLabel(a) + ': ' + [a.yellow ? a.yellow + '× ' + t.yellow : '', a.yellowRed ? a.yellowRed + '× ' + t.yellowRed : '', a.red ? a.red + '× ' + t.red : ''].filter(Boolean).join(', ')));
  }
  return L.join('\n');
}
function statsCsv(team, range){
  const t = T(), S = teamStats(team.id, range);
  const cell = v => { const x = String(v == null ? '' : v); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const rows = [t.csvHead].concat(S.players.slice().sort(STAT_SORT.name).map(a => [a.number == null ? '' : a.number, a.name, a.squad, a.apps, a.starts,
    a.minutes, a.avg, a.share, a.goals, a.pens, a.assists, a.own, a.yellow, a.yellowRed, a.red]));
  // Semikolon + BOM: oeffnet sich in einer deutschen Tabellenkalkulation direkt richtig
  return '\uFEFF' + rows.map(r => r.map(cell).join(';')).join('\r\n');
}

/* ---------------------------------------------------------------------
   TEXTE
--------------------------------------------------------------------- */
const pLabel = p => p ? (p.number != null ? p.number + ' ' + p.name : p.name) : T().unknown;
const pShort = p => p ? (p.number != null ? p.number + ' ' : '') + p.name.split(' ')[0] : '?';
const findP = (m, id) => id ? (m.ownPlayers.find(p => p.id === id) || m.oppPlayers.find(p => p.id === id)) : null;
const teamName = (m, side) => side === 'own' ? m.ownName : m.oppName;
const scoreText = (m, s) => m.isHome ? s.own + ':' + s.opp : s.opp + ':' + s.own;
const cardName = c => ({ yellow: T().yellow, yellowRed: T().yellowRed, red: T().red })[c];

function describe(m, e){
  const t = T();
  if(e.type === 'goal'){
    const who = e.playerId ? pLabel(findP(m, e.playerId)) : teamName(m, e.side);
    if(e.kind === 'ownGoal'){
      const ogTeam = teamName(m, e.side === 'own' ? 'opp' : 'own');
      return e.playerId ? t.evOwn(who, ogTeam) : t.evOwn(ogTeam, '');
    }
    return t.evGoal(who, e.kind === 'penalty') + (e.kind === 'normal' && e.assistId && findP(m, e.assistId) ? ' (' + t.assistBy(pLabel(findP(m, e.assistId))) + ')' : '');
  }
  if(e.type === 'card') return cardName(e.card) + ' ' + (e.playerId ? pLabel(findP(m, e.playerId)) : teamName(m, e.side));
  if(e.type === 'keeper') return t.evKeeper(pLabel(findP(m, e.playerId)));
  if(!e.outId) return t.evIn(pLabel(findP(m, e.inId)));
  return t.evSub(pLabel(findP(m, e.inId)), pLabel(findP(m, e.outId)));
}
function evColor(e){
  if(e.type === 'goal') return e.side === 'own' ? 'var(--green)' : 'var(--opp)';
  if(e.type === 'card') return e.card === 'yellow' ? 'var(--yellow)' : e.card === 'red' ? 'var(--red)' : 'var(--amber)';
  return 'var(--line)';
}
function buildReport(m, nowGame){
  const t = T();
  const st = derive(m, nowGame);
  const home = m.isHome ? m.ownName : m.oppName, away = m.isHome ? m.oppName : m.ownName;
  const L = [];
  const ht = st.halfTime && m.settings.periods === 2 ? ' (' + scoreText(m, st.halfTime) + ')' : '';
  const so = shootoutScore(m);
  L.push('⚽ ' + home + ' – ' + away + '  ' + scoreText(m, st.score) + ht + (m.extra && !so ? ' ' + t.aetShort : '') + (so ? ' – ' + scoreText(m, so) + ' ' + t.soShort : ''));
  L.push(fmtDate(matchDate(m)));
  const evs = sortEvents(m.events), run = { own: 0, opp: 0 }, pm = m;
  const goals = evs.filter(e => e.type === 'goal');
  if(goals.length){
    L.push('', t.rGoals);
    goals.forEach(g => { run[g.side]++; L.push(fmtMinute(g, pm) + '  ' + scoreText(m, run) + '  ' + describe(m, g)); });
  }
  const cards = evs.filter(e => e.type === 'card');
  if(cards.length){ L.push('', t.rCards); cards.forEach(c => L.push(fmtMinute(c, pm) + '  ' + describe(m, c) + (c.side === 'opp' && c.playerId ? ' (' + m.oppName + ')' : ''))); }
  const subs = evs.filter(e => e.type === 'sub');
  if(subs.length){ L.push('', t.rSubs); subs.forEach(s => L.push(fmtMinute(s, pm) + '  ' + describe(m, s) + (s.side === 'opp' ? ' (' + m.oppName + ')' : ''))); }
  if(m.notesShare && m.notes && m.notes.trim()) L.push('', t.notes, m.notes.trim());
  L.push('', t.playTimes(m.ownName));
  m.ownPlayers.slice().sort((a, b) => st.stats[b.id].played - st.stats[a.id].played)
    .forEach(p => L.push(pLabel(p) + ': ' + Math.round(st.stats[p.id].played / 60000) + ' min'));
  return L.join('\n');
}

/* ---------------------------------------------------------------------
   TEXT-IMPORT
   1) Spieltag aus dem Kaderplaner - derselbe Text, den TacticBoard
      versteht ("Team · Datum", "Heimspiel gegen X", "Kader (n)", "1. Name (TW)").
      Zusaetzlich verstanden: Abschnitte "Startelf"/"Aufstellung"/"Start"
      und "Bank", damit eine Aufstellung uebergeben werden kann.
   2) Freie Namensliste (DFBnet, Excel, WhatsApp ...).
--------------------------------------------------------------------- */
function parseMatchday(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const RE_HEADER = /^\*?\s*(.+?)\s*·\s*(.+?)\s*\*?$/;
  const RE_SECTION = /^\*?\s*(Kader|Squad|Startelf|Start(?:aufstellung)?|Aufstellung|Lineup|Starting(?:\s+XI)?|Bank|Bench|Ersatz(?:bank)?)\s*(?:\((\d+)\))?\s*:?\s*\*?$/i;
  const RE_PLAYER = /^\s*(\d{1,2})[.)]\s+(.+?)\s*$/;
  const RE_OPP = /\b(?:gegen|vs\.?|against)\s+(.+?)\s*$/i;
  const RE_HOME = /^\s*(Heimspiel|Ausw[äa]rtsspiel|Home|Away)\b/i;
  const RE_DATE = /(\d{1,2}\.\d{1,2}\.\d{0,4})/;
  const RE_KEEPER = /\s*\((TW|GK|Torwart|Keeper)\)\s*$/i;
  const blocks = [];
  let cur = null, sec = '';
  const finish = () => { if(cur && cur.players.length) blocks.push(cur); cur = null; sec = ''; };
  for(const raw of lines){
    const line = raw.trim();
    const h = line.match(RE_HEADER);
    if(h && RE_DATE.test(h[2]) && !RE_PLAYER.test(line)){
      finish();
      cur = { team: h[1].replace(/\*/g, '').trim().slice(0, 50), date: h[2].trim(), opponent: '', home: null, players: [], hasLineup: false };
      continue;
    }
    if(!cur) continue;
    const s = line.match(RE_SECTION);
    if(s){
      const w = s[1].toLowerCase();
      sec = /^(bank|bench|ersatz)/.test(w) ? 'bench' : /^(kader|squad)/.test(w) ? 'squad' : 'start';
      if(sec !== 'squad') cur.hasLineup = true;
      continue;
    }
    if(!sec){
      const hm = line.match(RE_HOME); if(hm) cur.home = /^(Heim|Home)/i.test(hm[1]);
      const om = line.match(RE_OPP);  if(om) cur.opponent = om[1].replace(/\s*\((Freundschaftsspiel|friendly)\)\s*$/i, '').replace(/\*/g, '').trim().slice(0, 50);
      continue;
    }
    if(line === '') continue;
    const pm = line.match(RE_PLAYER);
    if(pm){
      let name = pm[2].replace(/\*/g, '').trim();
      const keeper = RE_KEEPER.test(name);
      if(keeper) name = name.replace(RE_KEEPER, '').trim();
      // "7 Luca" hinter der Aufzaehlung = Trikotnummer
      let number = null;
      const nr = name.match(/^#?(\d{1,2})\s+(.+)$/) || name.match(/^(.+?)\s+#(\d{1,2})$/);
      if(nr){ if(/^\d/.test(nr[1])){ number = +nr[1]; name = nr[2]; } else { number = +nr[2]; name = nr[1]; } }
      if(name && cur.players.length < 40) cur.players.push({ name: name.slice(0, 40), number, keeper, role: sec });
    } else {
      sec = '';
    }
  }
  finish();
  return blocks;
}

function parseRoster(text){
  const days = parseMatchday(text);
  if(days.length) return days[0].players.map(p => ({ name: p.name, number: p.number, keeper: p.keeper }));
  const out = [], seen = new Set();
  const HEADER = /^(name|nachname|vorname|spieler(in)?(:innen)?|players?|nr\.?|no\.?|rückennummer|kader|squad|trikot)$/i;
  const DATE = /\b\d{1,2}\.\d{1,2}\.(\d{2}|\d{4})\b/g;
  const KEEPER = /\s*\((TW|GK|Torwart|Keeper)\)\s*/i;
  let lines = String(text || '').replace(/\r/g, '').split('\n');
  // Schlicht durchgezaehlte Liste (1. 2. 3. ...)? Dann sind die Ziffern keine Trikotnummern.
  const lead = lines.map(l => l.trim()).filter(Boolean).map(l => (l.match(/^(\d{1,2})[.)]\s/) || [])[1]);
  const enumerated = lead.length > 2 && lead.every((n, i) => n != null && +n === i + 1);
  for(const raw of lines){
    let line = raw.replace(DATE, ' ').replace(/[*_]/g, '').trim();
    if(!line) continue;
    let keeper = KEEPER.test(line);
    line = line.replace(KEEPER, ' ').trim();
    if(enumerated) line = line.replace(/^\d{1,2}[.)]\s+/, '');
    const cells = line.split(/\t|;|\s\|\s/).map(c => c.trim()).filter(Boolean);
    let number = null; const names = [];
    for(const c of cells){
      if(/^#?\d{1,2}\.?$/.test(c) && number == null) number = parseInt(c.replace(/\D/g, ''), 10);
      else if(/[a-zA-ZÀ-ž]/.test(c)) names.push(c);
    }
    if(!names.length) continue;
    let name = names[0];
    if(cells.length > 1 && names.length >= 2 && !/[ ,]/.test(name) && /^[A-ZÄÖÜ][a-zäöüß-]+$/.test(names[1])) name = names[1] + ' ' + name;
    const ld = name.match(/^#?(\d{1,2})[.):\-\s]+\s*(.+)$/);
    if(ld){ if(number == null) number = +ld[1]; name = ld[2]; }
    const tr = name.match(/^(.+?)\s*(?:\(#?(\d{1,2})\)|#(\d{1,2})|\s(\d{1,2}))$/);
    if(tr){ if(number == null) number = +(tr[2] || tr[3] || tr[4]); name = tr[1]; }
    name = name.replace(/^[-–•*·]+\s*/, '').replace(/\s+/g, ' ').trim();
    const cm = name.match(/^([^,]+),\s*([^,]+)$/);
    if(cm) name = cm[2] + ' ' + cm[1];
    if(!name || HEADER.test(name) || name.length > 40) continue;
    const key = name.toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    out.push({ name, number: isFinite(number) ? number : null, keeper });
  }
  return out;
}

/* ---------------------------------------------------------------------
   CSV-TABELLEN (Excel, Vereinslisten ...)
   Trennzeichen ; , oder Tab werden erkannt, Anfuehrungszeichen beachtet.
   Mit Kopfzeile ("Nr", "Name" bzw. "Vorname"/"Nachname", "TW"/"Position")
   werden die Spalten zugeordnet; ohne Kopfzeile wird jede Zeile wie eine
   eingefuegte Namensliste gelesen.
--------------------------------------------------------------------- */
function parseTable(text){
  const lines = String(text || '').replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if(!lines.length) return null;
  const head = lines.slice(0, 5);
  const count = (l, d) => l.split(d).length - 1;
  const delim = [';', '\t', ','].map(d => [d, head.reduce((n, l) => n + (count(l, d) > 0 ? 1 : 0), 0)])
    .sort((a, b) => b[1] - a[1])[0];
  if(!delim || delim[1] < Math.min(2, head.length)) return null;          // keine Tabelle
  const d = delim[0];
  const split = l => {
    const out = []; let cell = '', q = false;
    for(let i = 0; i < l.length; i++){
      const ch = l[i];
      if(q){ if(ch === '"'){ if(l[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
      else if(ch === '"') q = true;
      else if(ch === d){ out.push(cell.trim()); cell = ''; }
      else cell += ch;
    }
    out.push(cell.trim());
    return out;
  };
  const rows = lines.map(split);
  const H = {
    nr: /^(nr\.?|no\.?|nummer|rückennummer|rueckennummer|trikot(nummer)?|#|number|shirt( number)?)$/i,
    first: /^(vorname|first ?name|given ?name)$/i,
    last: /^(nachname|familienname|last ?name|surname)$/i,
    name: /^(name|spieler(in)?|spielername|player|name, ?vorname)$/i,
    pos: /^(tw|torwart|torhüter|position|pos\.?|rolle|role|keeper|gk)$/i
  };
  let hi = -1, map = null;
  for(let i = 0; i < Math.min(3, rows.length); i++){
    const m = {};
    rows[i].forEach((c, j) => { for(const k in H) if(m[k] == null && H[k].test(c)) m[k] = j; });
    if(m.name != null || m.first != null || m.last != null){ hi = i; map = m; break; }
  }
  if(!map) return { lines: rows.map(r => r.join('\t')) };
  const posHeader = map.pos != null ? rows[hi][map.pos] : '';
  const flagCol = /^(tw|torwart|torhüter|keeper|gk)$/i.test(posHeader);   // Spalte "TW" mit x/ja
  const players = [], seen = new Set();
  rows.slice(hi + 1).forEach(r => {
    const get = k => map[k] != null ? String(r[map[k]] || '').trim() : '';
    let name;
    if(get('first')) name = get('first') + ' ' + (get('last') || get('name'));
    else name = get('name') || get('last');
    name = name.replace(/\s+/g, ' ').trim();
    const cm = name.match(/^([^,]+),\s*([^,]+)$/);
    if(cm) name = cm[2] + ' ' + cm[1];
    if(!name || name.length > 40 || seen.has(name.toLowerCase())) return;
    seen.add(name.toLowerCase());
    const n = parseInt(get('nr').replace(/\D/g, ''), 10);
    const pv = get('pos');
    const keeper = flagCol ? /^(x|ja|yes|1|✓|✔|tw)$/i.test(pv) : /^(tw|torwart|torhüter|torhueter|gk|goalkeeper|keeper)$/i.test(pv);
    players.push({ name: name.slice(0, 40), number: isFinite(n) && n < 1000 ? n : null, keeper });
  });
  return { players };
}
/* Spieler aus einer Datei: Tabelle, sonst Namensliste */
function parseFileRoster(text){
  const tb = parseTable(text);
  if(tb && tb.players) return tb.players;
  return parseRoster(tb ? tb.lines.join('\n') : text);
}
/* Spieler in ein bestehendes Team uebernehmen (gleicher Name = aktualisieren) */
function mergeIntoTeam(team, players){
  let added = 0;
  players.forEach(np => {
    const p = team.players.find(x => x.name.toLowerCase() === np.name.toLowerCase());
    if(p){ if(np.number != null) p.number = np.number; if(np.keeper) p.keeper = true; }
    else if(team.players.length < 60){ team.players.push(cleanPlayer(Object.assign({}, np, { id: uid() }))); added++; }
  });
  return added;
}

/* ---------------------------------------------------------------------
   KADER-DATEI (Format von TacticBoard: { kind:'squads', squads:[...] })
--------------------------------------------------------------------- */
function teamsFromSquadFile(data){
  if(!data || data.kind !== 'squads' || !Array.isArray(data.squads)) return [];
  return data.squads.map(k => {
    if(!k || typeof k !== 'object') return null;
    const players = (Array.isArray(k.players) ? k.players : []).map(p => p && cleanPlayer({
      id: p.id, name: p.name, number: p.nr === '' ? null : p.nr, keeper: p.role === 'tw', sel: p.sel !== false,
      tb: { role: p.role, captain: p.captain === true }
    })).filter(Boolean);
    const tb = { form: String(k.form || ''), formation: String(k.formation || ''), showNr: k.showNr === true };
    if(k.sportEinst && typeof k.sportEinst === 'object') tb.sportEinst = k.sportEinst;
    return { name: String(k.name || '').trim().slice(0, 50), players, tb };
  }).filter(t => t && t.name);
}
function mergeTeam(name, players, isOwn, tb){
  let team = DB.teams.find(t => t.name.toLowerCase() === name.toLowerCase());
  let created = false;
  if(!team){ team = { id: uid(), name, isOwn: isOwn !== false, players: [] }; DB.teams.push(team); created = true; }
  if(tb) team.tb = tb;
  players.forEach(np => {
    const p = team.players.find(x => x.name.toLowerCase() === np.name.toLowerCase());
    if(p){
      if(np.number != null) p.number = np.number;
      if(np.keeper) p.keeper = true;
      if(np.sel != null) p.sel = np.sel;
      if(np.tb){ p.tb = np.tb; p.keeper = np.tb.role === 'tw'; }
    } else if(team.players.length < 60){
      const id = np.id && !team.players.some(x => x.id === np.id) ? np.id : uid();
      team.players.push(cleanPlayer(Object.assign({}, np, { id })));
    }
  });
  return { team, created };
}
function squadFileFor(teams){
  return {
    app: 'PitchPro', kind: 'squads', version: 1,
    squads: teams.map(t => {
      const tb = t.tb || {};
      const last = DB.lastSettings || DEFAULT_SETTINGS;
      const f = tb.form || String(last.playersOnField - 1);
      const k = {
        id: t.id, name: t.name, showNr: tb.showNr != null ? tb.showNr : true,
        form: ['4', '6', '8', '10', 'free'].indexOf(f) !== -1 ? f : '6', formation: tb.formation || '',
        players: t.players.map(p => {
          const pr = p.tb || {};
          // Torwart aus PitchPro hat Vorrang, sonst die Rolle aus TacticBoard
          const role = p.keeper ? 'tw' : (pr.role && pr.role !== 'tw' ? pr.role : '');
          return { id: p.id, name: p.name.slice(0, 30), nr: p.number == null ? '' : String(p.number),
                   role, captain: pr.captain === true, sel: p.sel !== false };
        })
      };
      if(tb.sportEinst) k.sportEinst = tb.sportEinst;
      return k;
    })
  };
}

/* Auf dem iPad braucht das Teilen-Fenster einen Ankerpunkt (wie in TacticBoard) */
function iPadAnchor(){
  return Math.max(0, Math.round(window.innerWidth / 2)) + ',' + Math.max(0, Math.round(window.innerHeight * 0.66)) + ',0,0';
}
async function shareText(text, title){
  // Eingebettet in der Kaderplaner-App: der Rahmen teilt nativ
  if(EMBEDDED && bridgeCaps.share){ bridgeSend('pp:share', { text: String(text).slice(0, 20000), title: String(title || '').slice(0, 100) }); return; }
  if(window.TbShare && window.TbShare.shareText){
    try { await window.TbShare.shareText(text, title || ''); return; } catch(e){}
  }
  const ss = window.plugins && window.plugins.socialsharing;
  if(window.cordova && ss && ss.shareWithOptions){
    ss.shareWithOptions({ message: text, subject: title || '', iPadPopupCoordinates: iPadAnchor() }, () => {}, () => {});
    return;
  }
  if(navigator.share){
    try { await navigator.share({ text, title }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast(T().copied); }
  catch(e){ openSheet(title || '', '', '<textarea class="in" readonly>' + esc(text) + '</textarea>'); }
}
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function saveFile(obj, name){
  return saveBlob(new Blob([JSON.stringify(obj)], { type: 'application/json' }), name, 'application/json');
}
async function saveBlob(blob, name, mime){
  if(window.TbShare && window.TbShare.saveFile){
    const b64 = await blobToBase64(blob);
    return await window.TbShare.saveFile(name, mime, b64) ? 'downloads' : '';
  }
  const ss = window.plugins && window.plugins.socialsharing;
  if(window.cordova && ss && ss.shareWithOptions){
    const dataUrl = 'df:' + name + ';data:' + mime + ';base64,' + await blobToBase64(blob);
    return new Promise((res, rej) => ss.shareWithOptions({ subject: name, files: [dataUrl], chooserTitle: name, iPadPopupCoordinates: iPadAnchor() },
      r => res(r && r.completed === false ? 'abbruch' : ''), e => rej(new Error(String(e || 'share')))));
  }
  if(IST_IOS && navigator.canShare){
    try {
      const f = new File([blob], name, { type: mime });
      if(navigator.canShare({ files: [f] })){ await navigator.share({ files: [f] }); return ''; }
    } catch(e){ if(e && e.name === 'AbortError') return 'abbruch'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.download = name; a.href = url; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return '';
}
const fileName = (base, ext) => base.replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g, '_').slice(0, 60) + '_' + new Date().toISOString().slice(0, 10) + (ext || '.json');

$('file-in').addEventListener('change', () => {

    const h = fileHandler; fileHandler = null;

function patchMatch(id, fn){
  const i = DB.matches.findIndex(m => m.id === id);
  if(i < 0) return;

  save();
}
function pushEvent(id, ev){
  const eid = uid();
  patchMatch(id, m => {
    const st = Clock.stamp(m.clock, Date.now());
    return Object.assign({}, m, { events: m.events.concat([Object.assign({ id: eid }, ev, st)]) });
  });
  vibrate(30);
  return eid;
}
function patchEvent(matchId, eventId, fn){
  patchMatch(matchId, m => Object.assign({}, m, { events: m.events.map(e => e.id === eventId ? fn(Object.assign({}, e)) : e) }));
}
function addSub(id, side, outId, inId){
  const eid = uid();
  patchMatch(id, m => {
    const st = Clock.stamp(m.clock, Date.now());
    return Object.assign({}, m, {
      reminderAckMs: side === 'own' ? st.gameMs : m.reminderAckMs,
      events: m.events.concat([Object.assign({ id: eid, type: 'sub', side, outId: outId || null, inId }, st)])
    });
  });
  vibrate(30);
  return eid;
}

/* Sicherung faellig? Erst ab 3 abgeschlossenen Spielen seit der letzten
   Sicherung und fruehestens 30 Tage danach - sonst nervt der Hinweis. */
function backupDue(now){
  now = now || Date.now();
  if(now < (DB.backupSnoozeUntil || 0)) return null;
  const since = DB.lastBackupAt || 0;
  const fresh = DB.matches.filter(m => m.clock.status === 'finished' && matchDate(m) > since);
  if(fresh.length < 3) return null;
  if(since && now - since < 30 * 86400000) return null;
  return { never: !since, days: since ? Math.floor((now - since) / 86400000) : 0, n: fresh.length };
}

/* ----- Elfmeterschiessen ----- */
function shootoutScore(m){
  if(!m.shootout || !m.shootout.length) return null;
  const s = { own: 0, opp: 0 };
  m.shootout.forEach(k => { if(k.scored) s[k.side]++; });
  return s;
}
function shootoutPanel(m){
  const t = T(), so = shootoutScore(m) || { own: 0, opp: 0 };
  const row = side => {
    const kicks = m.shootout.filter(k => k.side === side);
    return '<div class="so-row"><div class="so-name">' + esc(teamName(m, side)) + '</div><div class="so-dots">' +
      (kicks.length ? kicks.map(k => '<span class="so-dot ' + (k.scored ? 'in' : 'out') + '">' + (k.scored ? '●' : '✕') + '</span>').join('') : '<span class="hint" style="margin:0">–</span>') +
      '</div><div class="row2" style="gap:6px"><button class="btn" data-act="kick" data-side="' + side + '" data-v="1">' + esc(t.kickIn) + '</button>' +
      '<button class="btn ghost" data-act="kick" data-side="' + side + '" data-v="0">' + esc(t.kickOut) + '</button></div></div>';
  };
  const first = m.isHome ? ['own', 'opp'] : ['opp', 'own'];
  return '<div class="card" style="margin-top:16px"><div class="sec" style="margin:0 0 8px"><h2>' + esc(t.shootout) + '</h2><span class="meta num" style="font-size:18px">' +
    scoreText(m, so) + '</span></div>' + row(first[0]) + row(first[1]) +
    (m.shootout.length ? '<button class="btn ghost" data-act="kickUndo" style="margin-top:8px">' + esc(t.kickUndo) + '</button>'
                       : '<button class="btn ghost" data-act="shootoutCancel" style="margin-top:8px">' + esc(t.cancel) + '</button>') + '</div>';
}
/* Ergebnis aus Sicht des eigenen Teams: 1 Sieg, 0 Unentschieden, -1 Niederlage */
function matchResult(m, score){
  if(score.own !== score.opp) return score.own > score.opp ? 1 : -1;
  const so = shootoutScore(m);
  if(so && so.own !== so.opp) return so.own > so.opp ? 1 : -1;
  return 0;
}

/* ---------------------------------------------------------------------
   SPIELBERICHT ALS BILD (1080 px breit, fuer WhatsApp & Co.)
--------------------------------------------------------------------- */
function reportCanvas(m){
  const t = T(), st = derive(m, Clock.game(m.clock, Date.now()));
  const W = 1080, P = 70;
  const evs = sortEvents(m.events);
  const goals = evs.filter(e => e.type === 'goal'), cards = evs.filter(e => e.type === 'card');
  const rows = Math.max(1, goals.length) + (cards.length ? cards.length + 1 : 0);
  const H = Math.max(1080, 690 + rows * 62 + 150);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const F = (w, px) => w + ' ' + px + 'px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#2a7f35'); grd.addColorStop(1, '#0f3d18');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,0.04)'; for(let y = 0; y < H; y += 180) g.fillRect(0, y, W, 90);
  const fit = (txt, max) => { txt = String(txt); if(g.measureText(txt).width <= max) return txt;
    while(txt.length > 1 && g.measureText(txt + '…').width > max) txt = txt.slice(0, -1); return txt + '…'; };
  const wrap2 = (txt, x, y, max, lh) => {   // hoechstens zwei Zeilen
    const words = String(txt).split(' '); let a = '';
    let i = 0;
    for(; i < words.length; i++){ const n = a ? a + ' ' + words[i] : words[i]; if(g.measureText(n).width > max && a) break; a = n; }
    const b = words.slice(i).join(' ');
    if(!b){ g.fillText(fit(a, max), x, y); return; }
    g.fillText(fit(a, max), x, y - lh / 2); g.fillText(fit(b, max), x, y + lh / 2);
  };
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(255,255,255,0.8)'; g.font = F(600, 34);
  g.fillText(fmtDate(matchDate(m), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }), W / 2, 110);
  const home = m.isHome ? m.ownName : m.oppName, away = m.isHome ? m.oppName : m.ownName;
  g.fillStyle = '#fff'; g.font = F(800, 46);
  wrap2(home, W * 0.2, 340, 300, 54); wrap2(away, W * 0.8, 340, 300, 54);
  g.font = F(900, 170); g.fillText(scoreText(m, st.score), W / 2, 340);
  g.font = F(700, 36); g.fillStyle = 'rgba(255,255,255,0.85)';
  const so = shootoutScore(m);
  const sub = [st.halfTime && m.settings.periods === 2 ? t.htShort + ' ' + scoreText(m, st.halfTime) : '',
    so ? t.soShort + ' ' + scoreText(m, so) : m.extra ? t.aetLong : ''].filter(Boolean).join('  ·  ');
  if(sub) g.fillText(sub, W / 2, 500);
  g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(P, 570, W - 2 * P, 3);
  let y = 640;
  g.textBaseline = 'middle';
  const line = (min, txt, color, mark) => {
    g.textAlign = 'right'; g.font = F(800, 38); g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillText(min, P + 120, y);
    if(mark) mark(P + 150, y);

async function shareImageBlob(blob, name){

  }

  const a = document.createElement('a'); a.download = name; a.href = url; a.click();
